<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>iPe — Onboarding</title>
  <link rel="stylesheet" href="assets/prototype.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="rail-brand">iPe<span>Payments for shops</span></div>
      <div>
        <div class="rail-section-label">This shop</div>
        <div class="rail-app">
          <div class="name" id="rail-shop">New application</div>
          <div class="sub" id="rail-id">Not submitted</div>
          <span class="rail-status" id="rail-status">Draft</span>
        </div>
      </div>
      <div>
        <div class="rail-section-label">Application</div>
        <div class="rail-steps" id="rail-steps"></div>
      </div>
      <div class="rail-foot">
        <button type="button" id="new-app">New application</button>
        <p class="legal">Only the Merchant Risk Lead can turn a shop on. This chat prepares the review.</p>
      </div>
    </aside>

    <main class="main">
      <div class="app-header">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <div class="titles">
          <h1>Onboarding</h1>
          <p id="hdr-sub">Your shop</p>
        </div>
        <span class="status-pill draft" id="hdr-status">Draft</span>
      </div>
      <div class="chat" id="chat"><div class="chat-inner" id="chat-inner"></div></div>
      <div class="composer">
        <div class="composer-inner" id="composer"></div>
      </div>
    </main>
  </div>

  <div class="nav-scrim hidden" id="nav-scrim"></div>
  <div class="picker-scrim hidden" id="picker" role="dialog" aria-label="Choose a file">
    <div class="picker">
      <header>
        <strong id="picker-title">Choose a file</strong>
        <button type="button" id="picker-close">Cancel</button>
      </header>
      <ul id="picker-list"></ul>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
